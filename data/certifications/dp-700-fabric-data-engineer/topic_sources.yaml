# Mapeo (sección, índice de objetivo) -> URLs curadas de learn.microsoft.com
#
# Clave real: (section_number, objective_index), no el texto del objetivo
# (mismo patrón que topic_sources.yaml de Databricks — ver
# docs/contexto/decisiones.md D08). Los índices son 0-based, en el mismo
# orden en que aparecen los bullets de esa sección en el exam guide oficial
# (`tools/parse_exam_guide_microsoft.py`). El texto de cada objetivo incluye
# el prefijo de subgrupo (ej. "Configure security and governance: Implement
# dynamic data masking") — ver docs/contexto/decisiones.md D20.
#
# Cobertura: propuesta generada por investigación asistida (4 agentes en
# paralelo + investigación puntual para 2 objetivos que quedaron sin
# asignar en el primer reparto) para los 54 objetivos del exam guide de
# DP-700, 2026-07-31. Cada URL fue verificada (WebFetch / Microsoft Learn
# MCP `microsoft_docs_search`+`microsoft_docs_fetch`) antes de incluirse.
# Pendiente de revisión final de Miguel antes de correr
# `generate_questions.py --certification dp-700-fabric-data-engineer --all`
# — ver notas de objetivos con cobertura floja más abajo.
#
# Objetivos donde learn.microsoft.com no tiene una página que calce del
# todo con el bullet exacto del exam guide (revisar con criterio antes de
# generar, o aceptar cobertura parcial):
#   - 1.2 (OneLake workspace settings): no hay una página única "OneLake
#     workspace settings" — el tab de settings agrupa varias features
#     distintas (lifecycle management, diagnostics, etc.); se combinaron
#     las dos más sustanciales.
#   - 1.9 (row/column/object/folder-file level access controls): no hay
#     una página que cubra las 4 granularidades bajo un mismo heading
#     estilo exam guide — se combinó la doc general de OneLake con la
#     específica de Warehouse.
#   - 1.15 (Dataflow gen 2 vs pipeline vs notebook): las guías de decisión
#     reales de Microsoft comparan un set más amplio de herramientas
#     (Copy activity/Copy job/Dataflow/Eventstream/Spark), no exactamente
#     "Dataflow Gen2 vs pipeline vs notebook" como lo frasea el exam guide.
#   - 2.4 (Dataflows Gen2 vs notebooks vs KQL vs T-SQL): ninguna página
#     única compara las 4 opciones — se combinaron dos guías de decisión,
#     ninguna trata KQL/T-SQL como opciones de primera clase igual que
#     Dataflow Gen2/notebooks.
#   - 2.8 (transformar con PySpark, SQL y KQL): PySpark/SQL bien cubiertos
#     por un tutorial de Lakehouse; KQL tuvo que sacarse de un how-to de
#     creación de queryset, no de un tutorial de transformación dedicado.
#   - 2.11 (duplicados, datos faltantes, datos que llegan tarde): no hay
#     una página única de calidad de datos para batch — se combinó un
#     tutorial de Data Wrangler (duplicados/missing, contexto data
#     science) con la doc de Activator (late-arrival tolerance, contexto
#     real-time) porque no existe un equivalente directo en Data Factory.
#   - 2.17 (procesar con KQL, streaming): la página elegida documenta el
#     uso genérico de un KQL queryset, no un tutorial específico de
#     streaming con KQL.
#   - 2.18 (windowing functions): no existe una página dedicada a
#     "windowing functions en Fabric" — se combinó el operador SQL de
#     Eventstream (TumblingWindow/HoppingWindow, Fabric-específico) con el
#     artículo genérico de Azure Stream Analytics.
#   - 3.7 (errores de Eventhouse): no hay guía de troubleshooting dedicada
#     — se usó la página de "Manage and monitor an eventhouse" (sección
#     System overview), que documenta estados de error pero no es una
#     guía de troubleshooting como las de pipelines/notebooks/warehouse.
#   - 3.10 (errores de shortcuts de OneLake): no hay una guía única de
#     troubleshooting de shortcuts — se combinó un bullet genérico de la
#     guía de Spark con una guía específica de errores de shortcuts en
#     modo delegado del SQL analytics endpoint.

