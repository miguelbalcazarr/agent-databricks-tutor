          - https://docs.databricks.com/aws/en/tables/convert-to-managed
      1:  # "Configure access controls using the UI and SQL (GRANT, REVOKE, DENY)..." (DENY no documentado, ver nota arriba)
        urls:
          - https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges
      2:  # "Understand column-level masking and row-level security..."
        urls:
          - https://docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks
      3:  # "Understand Unity Catalog ABAC policies..."
        urls:
          - https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac
